<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="cadastro.css" media="screen">
    <title>Cadastro</title>
    <style>/* Reset básico e identidade visual idêntica ao login */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: #1e2f61; /* Fundo azul escuro igual ao login */
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}

/* Cabeçalho da página (Título e Descrição) */
body > div:first-of-type {
    text-align: center;
    color: #ffffff;
    margin-bottom: 25px;
    max-width: 600px;
}

body > div:first-of-type h1 {
    font-size: 32px;
    margin-bottom: 8px;
    color: #ffffff;
}

body > div:first-of-type p {
    color: #a0aec0;
    font-size: 14px;
}

/* Caixa principal (Card) que envolve o formulário */
form {
    background-color: #ffffff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 600px; /* Um pouco mais largo que o login para caber os campos */
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* Estilização das seções (Fieldsets) */
fieldset {
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

legend {
    font-weight: bold;
    color: #1c2541;
    font-size: 16px;
    padding: 0 8px;
}

/* Labels dos campos */
label {
    font-size: 13px;
    font-weight: 600;
    color: #4a5568;
    margin-bottom: -6px; /* Aproxima a label do input */
}

/* Inputs e Selects */
input[type="text"],
input[type="email"],
input[type="tel"],
input[type="date"],
input[type="password"],
select {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #dcdcdc;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.3s;
    background-color: #fff;
}

input:focus, select:focus {
    border-color: #3a506b; /* Cor de destaque ao focar */
}

/* Botão de Cadastrar (Mesmo estilo do botão Entrar) */
.butao {
    width: 100%;
    padding: 14px;
    background-color: #1c2541;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s;
    margin-top: 10px;
}

.butao:hover {
    background-color: #3a506b;
}</style>
    
</head>
<body>
    <div>
        <h1>Criar Conta</h1>
        <p id="descricao">Bem-vindo ao Flex Wash, preencha as informações abaixo para criar uma nova conta.</p>
        <br>
    </div>
    <form onsubmit="Cadastrar(event)">
    <!-- DADOS PESSOAIS -->
    <fieldset class="dados-pessoais">
        <legend>Dados Pessoais</legend>
        <main id="form-container">
        
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required><br><br>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required><br><br>

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required><br><br>

        <label for="data_nascimento">Data de Nascimento:</label>
        <input type="date" id="data_nascimento" name="data_nascimento" required><br><br>

        <label for="genero">Gênero:</label>
        <select id="genero" name="genero" required><br><br>
            <option value="" disabled selected>Selecione</option>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="outro">Outro</option>
        </select>
    </fieldset>

    <!-- ENDEREÇO -->
    <fieldset class="endereco">
        <legend>Endereço</legend>

        <label for="cep">CEP:</label>
        <input type="text" id="cep" name="cep" placeholder="00000-000" required><br><br>

        <label for="endereco">Endereço (Rua/Avenida):</label>
        <input type="text" id="endereco" name="endereco" required><br><br>

        <label for="numero">Número:</label>
        <input type="text" id="numero" name="numero" required><br><br>

        <label for="complemento">Complemento:</label>
        <input type="text" id="complemento" name="complemento" placeholder="Apto, Bloco, etc."><br><br>

        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" name="bairro" required><br><br>

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade" required><br><br>

        <label for="estado">Estado:</label>
        <input type="text" id="estado" name="estado" placeholder="UF" maxlength="2" required><br><br>
    </fieldset>

    <!-- SEGURANÇA -->
    <fieldset class="seguranca">
        <legend>Segurança</legend>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required><br><br>

        <label for="confirmar_senha">Confirmar Senha:</label>
        <input type="password" id="confirmar_senha" name="confirmar_senha" required><br><br>
    </fieldset>

    <button class="butao" type="submit">Cadastrar</button>
</form>
    <script>
    function Cadastrar(event) {
        event.preventDefault();

        var email = document.getElementById("email").value;
        var senha = document.getElementById("senha").value;
        var confirmarSenha = document.getElementById("confirmar_senha").value;

        // Valida se as senhas batem
        if (senha !== confirmarSenha) {
            alert("As senhas não coincidem!");
            return;
        }

        // Salva os dados na memória do navegador
        localStorage.setItem("usuarioEmail", email);
        localStorage.setItem("usuarioSenha", senha);

        alert("Cadastro realizado com sucesso! Faça o login.");
        
        // Redireciona de volta para a página de login
        location.href = "login.html";
    }
</script>
   
</body>
</html>
